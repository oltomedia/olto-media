<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:PJ;src:url(fonts/pj-500.woff2);font-weight:500}@font-face{font-family:PJ;src:url(fonts/pj-700.woff2);font-weight:700}@font-face{font-family:PJ;src:url(fonts/pj-800.woff2);font-weight:800}@font-face{font-family:IS;src:url(fonts/is-italic.woff2);font-style:italic}@font-face{font-family:PM;src:url(fonts/plex-mono.woff2)}
body{margin:0;background:#000}#out{width:1080px}#out svg{display:block}</style></head><body><div id="out"></div>
<script src="studio.js"></script><script>window.TKFADE_ON=(new URLSearchParams(location.search)).get("fade")!=="0";
(async()=>{await OltoStudio.ready();window.IMGS=await OltoStudio.images();
window.show=(kind,data,i,fmt)=>{let svg;if(kind==='une')svg=OltoStudio.uneSVG(data);else if(kind==='top5')svg=fmt==='tiktok-h'?OltoStudio.storyTK(data,'hausses'):fmt==='tiktok-b'?OltoStudio.storyTK(data,'baisses'):OltoStudio.storySVG(data);else if(kind==='actu')svg=OltoStudio.actuSVG(data,fmt);else if(kind==='mot')svg=OltoStudio.motSVG(data,IMGS,fmt);else svg=OltoStudio.slideSVG(data,data.slides[i],i,data.slides.length,IMGS,fmt);if(fmt&&String(fmt).startsWith('tiktok'))svg=OltoStudio.tallTK(OltoStudio.fitTK(svg,window.__PLEIN?{x0:50,x1:890,y0:640,y1:1555,max:1.5}:undefined),window.TKH||2340);document.getElementById('out').innerHTML=svg;return true};
// contrôle des marges : chaque texte (et objet) dans la zone visible, et à 20 px minimum du bord de son bloc
window.check=(z)=>{const svg=document.querySelector('#out svg');const o=svg.getBoundingClientRect();const pb=[];
 const boxes=[...svg.querySelectorAll('rect[rx]')].map(r=>{const b=r.getBoundingClientRect();return {x:b.left-o.left,y:b.top-o.top,w:b.width,h:b.height}}).filter(b=>b.w<1000&&b.h>60);
 svg.querySelectorAll('text,image:not([data-plein])').forEach(t=>{const b=t.getBoundingClientRect();if(!b.width)return;const x=b.left-o.left,y=b.top-o.top,r=x+b.width,bt=y+b.height;const lab=(t.textContent||t.tagName).trim().slice(0,40);
  if(x<z.x0-1||r>z.x1+1||y<z.y0-1||bt>z.y1+1)pb.push(`hors zone (${Math.round(x)},${Math.round(y)})-(${Math.round(r)},${Math.round(bt)}) : « ${lab} »`);
  if(t.tagName==='text'){const cx=x+b.width/2,cy=y+b.height/2;const bx=boxes.find(k=>cx>k.x&&cx<k.x+k.w&&cy>k.y&&cy<k.y+k.h);const fs=parseFloat(t.getAttribute('font-size')||40);if(bx&&(x<bx.x+16||r>bx.x+bx.w-16||(fs<=70&&(y<bx.y+8||bt>bx.y+bx.h-8))))pb.push(`collé au bord de son bloc : « ${lab} » texte (${Math.round(x)},${Math.round(y)},${Math.round(r)},${Math.round(bt)}) bloc (${Math.round(bx.x)},${Math.round(bx.y)},${Math.round(bx.x+bx.w)},${Math.round(bx.y+bx.h)})`)}});
 return pb};
window.READY=1})();
</script></body></html>
