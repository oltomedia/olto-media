name: Récupérer une voix ElevenLabs
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Lien MP3 signé (ElevenLabs)"
        required: true
      path:
        description: "Chemin de destination dans le dépôt (ex. voix/2026-12-04-save-more-tomorrow.mp3)"
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger
        env:
          URL: ${{ inputs.url }}
          DEST: ${{ inputs.path }}
        run: |
          case "$URL" in https://elevenlabsusercontent.com/*|https://storage.googleapis.com/eleven-*) ;; *) echo "URL refusée"; exit 1;; esac
          case "$DEST" in voix/*.mp3) ;; *) echo "Chemin refusé"; exit 1;; esac
          mkdir -p "$(dirname "$DEST")"
          curl -fsSL "$URL" -o "$DEST"
          file "$DEST"
      - name: Enregistrer
        env:
          DEST: ${{ inputs.path }}
        run: |
          git config user.name "Olto (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Voix : $DEST"
          git push
