name: Banque de photos (Wikimedia Commons, licences libres)
on:
  workflow_dispatch:
  push:
    paths: ['img/banque/demande.json', 'tools/banque.py']
permissions:
  contents: write
concurrency: banque
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow && python3 tools/banque.py
      - name: Enregistrer
        run: |
          git config user.name "Olto (GitHub Actions)"
          git config user.email "actions@users.noreply.github.com"
          git add img/banque
          git commit -m "Banque de photos : mise à jour" || exit 0
          git pull --rebase && git push
